<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for Reaching Out | The Smoky Nest</title>
<meta name="robots" content="noindex, follow">
<style>
  :root{
    --green:#2f5d3f; --green-dk:#1f3d2a; --gold-lt:#e0a458; --gold-deep:#9a6011;
    --cream:#f7f3ec; --ink:#23241f; --muted:#5f635b; --card:#ffffff;
    --shadow:0 6px 24px rgba(31,61,42,.10); --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
  header.nav{background:var(--green-dk)}
  header.nav .wrap{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:60px}
  .brand{color:#fff;font-family:Georgia,serif;font-weight:700;font-size:1.15rem;
    text-decoration:none;letter-spacing:.3px}
  .brand span{color:var(--gold-lt)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:44px 34px;max-width:560px;width:100%;text-align:center}
  .eyebrow{color:var(--gold-deep);font-weight:700;letter-spacing:2px;
    text-transform:uppercase;font-size:.8rem;margin:0 0 8px}
  h1{font-family:Georgia,"Times New Roman",serif;color:var(--green-dk);
    line-height:1.2;margin:0 0 14px;font-size:clamp(1.7rem,4vw,2.3rem)}
  .panel p{color:var(--muted);margin:0 auto 26px;max-width:44ch}
  .btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;
    font-weight:700;padding:14px 30px;border-radius:50px;font-size:1rem;
    box-shadow:var(--shadow);min-height:44px;transition:.2s}
  .btn:hover{background:var(--green-dk);transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid var(--gold-deep);outline-offset:3px}
  footer{background:var(--green-dk);color:#cfe0d3;text-align:center;padding:26px 20px;font-size:.9rem}
  footer a{color:#cfe0d3}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="/" class="brand">The Smoky <span>Nest</span></a>
  </div>
</header>

<main>
  <div class="panel">
    <p class="eyebrow">Message Sent</p>
    <h1>Thanks for reaching out.</h1>
    <p>We have your message and will get back to you soon.</p>
    <a class="btn" href="/">Back to The Smoky Nest</a>
  </div>
</main>

<footer>
  <p>Pigeon Forge, Tennessee &nbsp;·&nbsp; <a href="/#book">Book Direct</a></p>
</footer>

</body>
</html>
