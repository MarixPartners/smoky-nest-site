<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Smoky Nest — Check-In Card</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--green:#2f5d3f;--green-dk:#1f3d2a;--gold:#c98a3a;--gold-lt:#e0a458;--cream:#f7f3ec;--ink:#23241f;--muted:#6b6f66}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:24px}
  .toolbar{display:flex;gap:12px;margin-bottom:20px}
  .toolbar button{background:var(--green);color:#fff;border:0;border-radius:50px;padding:11px 22px;font-size:.95rem;
    font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(31,61,42,.25)}
  .toolbar button.alt{background:var(--gold)}
  .toolbar button:hover{opacity:.9}

  /* The printable card: 5x7 portrait */
  .card{width:5in;height:7in;background:var(--cream);border-radius:18px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;
    border:2px solid #e2dccd;position:relative}
  .card .top{background:var(--green-dk);color:#fff;text-align:center;padding:26px 20px 22px}
  .cabin{font-size:2.1rem;line-height:1}
  .card h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;margin:8px 0 2px;font-weight:700}
  .card .sub{color:var(--gold-lt);letter-spacing:3px;font-size:.72rem;text-transform:uppercase;font-weight:700}
  .card .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px;text-align:center}
  .card .prompt{font-family:Georgia,serif;font-size:1.32rem;color:var(--green-dk);line-height:1.3;margin-bottom:4px}
  .card .prompt b{color:var(--gold)}
  .qrbox{background:#fff;padding:14px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.10);margin:16px 0 14px;line-height:0}
  .qrbox canvas,.qrbox img{width:2.5in !important;height:2.5in !important;display:block}
  .card .tags{font-size:.78rem;color:var(--muted);letter-spacing:.4px;margin-top:2px}
  .card .url{font-size:.74rem;color:var(--green);font-weight:700;word-break:break-all;margin-top:10px}
  .card .foot{background:var(--gold);color:#fff;text-align:center;font-size:.72rem;letter-spacing:1.5px;
    text-transform:uppercase;font-weight:700;padding:10px}

  @media print{
    @page{margin:0}
    body{background:#fff;padding:0}
    .toolbar{display:none}
    .card{box-shadow:none;border:none;border-radius:0;margin:0 auto}
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button onclick="window.print()">🖨️ Print Card</button>
    <button class="alt" onclick="downloadPNG()">⬇️ Download QR as PNG</button>
  </div>

  <div class="card">
    <div class="top">
      <div class="cabin">🏡</div>
      <h1>The Smoky Nest</h1>
      <div class="sub">— Pigeon Forge, TN —</div>
    </div>
    <div class="body">
      <div class="prompt">Scan for your <b>Local Guide</b></div>
      <div class="qrbox" id="qr"></div>
      <div class="tags">Attractions · Dining · Mountain Coasters · Directions</div>
      <div class="url">thesmokynest.com</div>
    </div>
    <div class="foot">Relax · Explore · Make Memories</div>
  </div>

<script>
  var SITE_URL = "https://thesmokynest.com/";
  // Render at high resolution for a crisp PNG/print; CSS scales the display size.
  var qr = new QRCode(document.getElementById("qr"), {
    text: SITE_URL,
    width: 600,
    height: 600,
    colorDark: "#1f3d2a",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  function downloadPNG(){
    var cv = document.querySelector("#qr canvas");
    var dataUrl;
    if(cv){ dataUrl = cv.toDataURL("image/png"); }
    else {
      var img = document.querySelector("#qr img");
      if(!img){ alert("QR still rendering — give it a second and try again."); return; }
      dataUrl = img.src;
    }
    var a = document.createElement("a");
    a.href = dataUrl;
    a.download = "smoky-nest-qr.png";
    document.body.appendChild(a); a.click(); a.remove();
  }
</script>
</body>
</html>
