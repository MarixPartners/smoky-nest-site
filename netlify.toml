# Netlify configuration for The Smoky Nest
#
# Purpose: keep NON-PRODUCTION deploys (branch deploys and deploy previews) out
# of search engines, without changing anything about the production site.
#
# Note: headers declared in netlify.toml with [[headers]] are GLOBAL and cannot
# be scoped to a deploy context. The approach Netlify documents for per-context
# headers is to copy a context-specific `_headers` file into the publish
# directory as part of that context's build command.
#
# Production (`main`) intentionally defines NO context block and NO build
# command here, so no `_headers` file is ever produced for production and its
# response headers are unchanged.

[context.branch-deploy]
  command = "cp ./deploy-headers/_noindexHeaders ./_headers"

[context.deploy-preview]
  command = "cp ./deploy-headers/_noindexHeaders ./_headers"

# Legacy path: /book-now was never a page on this site, but the path may exist
# in older printed material or third-party listings. Send it permanently to the
# homepage booking section. This is a server-side path redirect only; the #book
# fragment is applied by the browser and never reaches the server.

[[redirects]]
  from = "/book-now"
  to = "/#book"
  status = 301

[[redirects]]
  from = "/book-now.html"
  to = "/#book"
  status = 301
